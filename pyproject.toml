[project]
name = "nextshift"
version = "0.1.0"
description = "NextShift - Campus Part-time Job Marketplace Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "fastapi>=0.110.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.28",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP046", "UP042", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
